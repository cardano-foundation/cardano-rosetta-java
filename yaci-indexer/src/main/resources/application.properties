spring.profiles.active=${YACI_SPRING_PROFILES: h2}
spring.config.import=classpath:config/db-indexes.yaml
server.port=9095
#The following flyway section is mandatory
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/store/{vendor}

#Api prefix for out-of-box REST API
apiPrefix=/api/v1

## Other Yaci Store properties can be configured here or in application properties under config folder. ##
################## Network Configuration ###########
# Provide network details
####################################################

store.cardano.host=${CARDANO_NODE_HOST:preprod-node.world.dev.cardano.org}
store.cardano.port=${CARDANO_NODE_PORT:30000}
store.cardano.protocol-magic=${PROTOCOL_MAGIC:1}
# 3 seconds for keep alive
store.cardano.keep-alive-interval=3000
store.cardano.return-tx-body-cbor=true

############### Genesis files #############################
# The application reads the below genesis files to get data like slotLength, maxLovelaceSupply
# etc. If this section is not provided, the application will try to use the values defined in the application itself. The
# values for all known networks are already defined in the application. So, this section is not required for known networks.
############################################################
store.cardano.byron-genesis-file=${GENESIS_BYRON_PATH:/config/byron-genesis.json}
store.cardano.shelley-genesis-file=${GENESIS_SHELLEY_PATH:/config/shelley-genesis.json}
store.cardano.alonzo-genesis-file=${GENESIS_ALONZO_PATH:/config/alonzo-genesis.json}
store.cardano.conway-genesis-file=${GENESIS_CONWAY_PATH:/config/conway-genesis.json}

####################
# Submit Api url
####################
#store.cardano.submit-api-url=http://localhost:8090/api/submit/tx

################################
#Enable Tx mempool monitoring
################################
#store.cardano.mempool-monitoring-enabled=true
#########################################################
#       Log Configuration
#########################################################
logging.file.name= ./logs/yaci-store.log

##########################################################
#      Sync Configuration
# Uncomment the following properties if you want to sync from a particular slot and blockhash.
# By default, the application will start syncing from the genesis block
##########################################################
#store.cardano.sync-start-slot=13262804
#store.cardano.sync-start-blockhash=72ba06d8ff371db58b8987399ae7bb0fe5fcc721ec09c064c864d56d862adaa8

#store.cardano.sync-stop-slot=76667163
#store.cardano.sync-stop-blockhash=3e9a93afb174503befd4e8dabd52f73e6c4e9c3c76886713475dd43b00e6acbf

#################################################
# Epoch aggregation interval in seconds. Epoch aggregations like total txs in an epoch, total fees in an epoch etc are
# calculated in a particular interval. This interval is defined by this property.
# As the current implementation of epoch aggregation is not efficient, it is recommended to keep this value high if you are
# running the application for mainnet. When the aggregation is running on mainnet, you may see lag in the sync process. But
# once the aggregation is done, the sync process will catch up. This will be fixed in the future releases.

# For test networks, it is fine to keep this value low like 300 (5 minutes).
# Default value is 14400 (4 hours)
#################################################
store.blocks.epoch-calculation-interval=14400

#######################################################################
# Enable / Disable local utxo client
# By default, local utxo client is enabled if utxo module is available in the classpath. This flag is useful for testing
# when you want to disable local utxo client and use remote utxo client.
#######################################################################
#store.enable.local.utxo.client=false

## Set the following flag to false if you want to disable auto start of sync process. Defualt is true.
#store.sync-auto-start=true
management.endpoints.web.exposure.include=health,info,prometheus,rosettaIndexes
management.endpoints.web.path-mapping.rosettaIndexes=rosetta-indexes
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.startup.include=db,yaciConnection
management.endpoint.health.group.liveness.include=livenessState,yaciConnection,indexStall
management.endpoint.health.group.readiness.include=readinessState,db,yaciSync
cardano.rosetta.index.stall-timeout-minutes=${INDEX_STALL_TIMEOUT_MINUTES:360}
cardano.rosetta.index.failed-retry-max-attempts=${INDEX_FAILED_RETRY_MAX_ATTEMPTS:3}
cardano.rosetta.index.failed-retry-delay-minutes=${INDEX_FAILED_RETRY_DELAY_MINUTES:30}
cardano.rosetta.index.query-timeout-seconds=${INDEX_QUERY_TIMEOUT_SECONDS:21600}
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

###################################################
# Parallel processing configuration
###################################################
store.executor.enable-parallel-processing=true
store.executor.block-processing-threads=15
store.executor.event-processing-threads=30

store.executor.blocks-batch-size=200
store.executor.blocks-partition-size=10

store.executor.use-virtual-thread-for-batch-processing=true
store.executor.use-virtual-thread-for-event-processing=true

## Enable this flag to automatically delete optional indexes at the start of synchronization and recreate them once it approaches completion
store.auto-index-management=true

#####################################
# DB insert batch properties for JOOQ
#####################################
store.db.batch-size=1000
store.db.parallel-insert=true
#store.cardano.keep-alive-interval=1000
logging.level.com.bloxbean.cardano.yaci.core.protocol.keepalive=debug

store.admin.auto-recovery-enabled=true
store.admin.health-check-interval=20

#####################################
# Admin UI Configuration
# Admin UI can be accessed at http://ip:port/admin-ui/
#####################################
store.admin.ui.enabled=true
# Enable/disable sync control operations (start/stop/restart) in Admin UI.
# When disabled, sync control buttons are hidden and API endpoints return 403.
# Also disabled automatically when store.read-only-mode=true
store.admin.ui.sync-control-enabled=true
# Header text displayed in Admin UI
store.admin.ui.header-text="Cardano Rosetta Java Admin - Powered by Yaci Store"

store.utxo.pruning-enabled=${REMOVE_SPENT_UTXOS:true}
store.utxo.pruning-safe-blocks=${REMOVE_SPENT_UTXOS_LAST_BLOCKS_GRACE_COUNT:129600}
store.utxo.pruning-interval=10800
store.utxo.pruning-batch-size=${REMOVE_SPENT_UTXOS_BATCH_SIZE:3000}
logging.level.com.bloxbean.cardano.yaci.store=${LOG:error}
spring.datasource.hikari.pool-name=CardanoRosettaJavaIndexerDBPool
spring.datasource.hikari.minimum-idle=${INDEXER_DB_POOL_MIN_COUNT:5}
spring.datasource.hikari.maximum-pool-size=${INDEXER_DB_POOL_MAX_COUNT:20}
spring.datasource.hikari.max-lifetime=${INDEXER_DB_POOL_MAX_LIFETIME_MS:2000000}
spring.datasource.hikari.connection-timeout=${INDEXER_DB_POOL_CONNECTION_TIMEOUT_MS:100000}
spring.datasource.hikari.keepalive-time=${INDEXER_DB_KEEP_ALIVE_MS:60000}
spring.datasource.hikari.leak-detection-threshold=${INDEXER_DB_LEAK_CONNECTIONS_WARNING_MS:60000}
spring.datasource.hikari.register-mbeans=${INDEXER_DB_MONITOR_PERFORMANCE:false}
spring.jpa.properties.hibernate.format_sql=${INDEXER_DB_SHOW_SQL:false}

store.epoch.endpoints.epoch.local.enabled=true

store.continue-on-parse-error=${CONTINUE_PARSING_ON_ERROR:false}

jobs.peer-discovery.enabled=${PEER_DISCOVERY:false}

#####################################################################################################
# N2C (Node-to-Client) connection pool
#
# The n2c local-state-query connection to the local Cardano node is used for stake-account reward
# lookups (/account/balance for stake addresses), protocol parameter fetching and tx submission.
# With pooling disabled (yaci-store default), every such call opens a fresh socket + n2c handshake
# and tears it down afterwards. Pooling reuses warm connections and removes that per-request churn.
#
# NOTE: the "max total" key is store.cardano.n2c-pool-max-total (binds to n2cPoolMaxTotal). yaci-store's
# own sample config uses n2c-max-total, which does NOT bind - do not copy that name.
# Only takes effect when n2c is configured (n2c-socket / n2c-socat profiles).
#
# Upstream documentation:
# https://store.yaci.xyz/docs/v2/stores/configuration#n2c-connection-pool-configuration
#####################################################################################################
store.cardano.n2c-pool-enabled=true
store.cardano.n2c-pool-max-total=10
store.cardano.n2c-pool-min-idle=2
store.cardano.n2c-pool-max-idle=5
store.cardano.n2c-pool-max-wait-in-millis=10000

# disable local state for n2c governance for now
#When enabled, yaci-store will periodically query the Cardano node's  current governance state via n2c protocol: proposal status, drep distribution,...
#Before the  governance-aggr module was introduced, this was the only way to get the above governance data: proposal status,, drep distribution (voting power), current committee state...
store.governance.n2c-gov-state-enabled=false
