name: PR Preprod Tests

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:  # Allow manual trigger for debugging

# Permissions needed for GitHub Pages deployment and PR comments
permissions:
  contents: write  # Changed from 'read' to 'write' to allow pushing to gh-pages branch
  pages: write
  id-token: write
  pull-requests: write

jobs:
  test-on-preprod:
    runs-on: [preview-server-colo2]
    concurrency:
      group: preprod-host-deployment
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      REMOVE_SPENT_UTXOS: "false"
      DB_PORT: "5433"
      TOKEN_REGISTRY_ENABLED: "true"
      TOKEN_REGISTRY_BASE_URL: https://preprod.tokens.cardano.org/api
      BLOCK_TRANSACTION_API_TIMEOUT_SECS: "10"

    steps:
      - uses: actions/checkout@v4

      - name: Update local repository
        run: |
          cd /home/integration/git/cardano-rosetta-java

          # Fetch latest from remote
          git fetch origin

          # Clean up any existing PR branch and switch to main first
          git checkout main || git checkout develop
          git pull origin main || git pull origin develop

          # Checkout appropriate branch based on trigger type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git branch -D pr-${{ github.event.pull_request.number }} 2>/dev/null || true
            git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }}
            git checkout pr-${{ github.event.pull_request.number }}
          else
            # workflow_dispatch: checkout the selected branch and force sync with remote
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
          fi

      - name: Stop current services
        run: |
          cd /home/integration/git/cardano-rosetta-java

          # Stop all services
          docker compose \
            --env-file .env.docker-compose-preprod \
            --env-file .env.docker-compose-profile-mid-level \
            -f docker-compose.yaml \
            down

      - name: Build and start services with PR code
        id: deployment
        run: |
          cd /home/integration/git/cardano-rosetta-java

          # Use PR-specific tag for API and indexer to force rebuild
          export RELEASE_VERSION=pr-${{ github.event.pull_request.number }}-${{ github.sha }}

          # Build and start all services
          docker compose \
            --env-file .env.docker-compose-preprod \
            --env-file .env.docker-compose-profile-mid-level \
            -f docker-compose.yaml \
            up --build -d --wait

      - name: Wait for API to sync
        timeout-minutes: 10
        run: |
          echo "Waiting for API to be ready..."

          # Wait for API to respond
          API_STARTED=false
          for i in {1..60}; do
            if curl -sf -X POST http://localhost:8082/network/list \
              -H 'Content-Type: application/json' \
              -d '{}' > /dev/null 2>&1; then
              echo "API is responding"
              API_STARTED=true
              break
            fi
            echo "Waiting for API to start... ($i/60)"
            sleep 10
          done

          if [ "$API_STARTED" != "true" ]; then
            echo "❌ API failed to start after 10 minutes"
            exit 1
          fi

          # Check sync status
          echo "Checking sync status..."
          while true; do
            SYNC_STATUS=$(curl -s -X POST http://localhost:8082/network/status \
              -H 'Content-Type: application/json' \
              -d '{"network_identifier": {"blockchain": "cardano", "network": "preprod"}}' | \
              jq -r '.sync_status.synced' 2>/dev/null || echo "false")

            if [ "$SYNC_STATUS" = "true" ]; then
              echo "✓ API is synced and ready!"

              # Show current block for verification
              CURRENT_BLOCK=$(curl -s -X POST http://localhost:8082/network/status \
                -H 'Content-Type: application/json' \
                -d '{"network_identifier": {"blockchain": "cardano", "network": "preprod"}}' | \
                jq -r '.current_block_identifier.index')
              echo "Current block: $CURRENT_BLOCK"
              break
            fi

            echo "Waiting for sync... (synced=$SYNC_STATUS)"
            sleep 10
          done

      - name: Install test dependencies
        run: |
          # Ensure uv is in PATH
          export PATH="$HOME/.local/bin:$PATH"

          cd /home/integration/git/cardano-rosetta-java/tests/data-endpoints

          # Sync Python dependencies
          uv sync

      - name: Create test environment file
        run: |
          cd /home/integration/git/cardano-rosetta-java

          # Merge defaults; tests keep the job's environment overrides.
          cat .env.docker-compose-preprod > .env.test
          cat .env.docker-compose-profile-mid-level >> .env.test

          # Copy to tests directory
          cp .env.test tests/data-endpoints/.env

      - name: Clean previous Allure results
        run: rm -rf /home/integration/git/cardano-rosetta-java/tests/data-endpoints/allure-results/*

      - name: Run smoke tests (validate test data)
        id: smoke_tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          cd /home/integration/git/cardano-rosetta-java/tests/data-endpoints

          # Run smoke tests to validate network_test_data.yaml
          uv run pytest -m smoke \
            -n 0 \
            --alluredir=./allure-results \
            --tb=short \
            -v || SMOKE_RESULT=$?

          # Output smoke test result
          echo "smoke_result=${SMOKE_RESULT:-0}" >> $GITHUB_OUTPUT

          # Fail if smoke tests failed
          exit ${SMOKE_RESULT:-0}
        env:
          ROSETTA_URL: http://localhost:8082
          CARDANO_NETWORK: preprod

      - name: Run behavioral tests
        id: test
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          cd /home/integration/git/cardano-rosetta-java/tests/data-endpoints

          # Run behavioral tests (skip smoke tests)
          uv run pytest -m "not smoke" \
            -n auto \
            --alluredir=./allure-results \
            --tb=short \
            -v || TEST_RESULT=$?

          # Output test result for later steps
          echo "test_result=${TEST_RESULT:-0}" >> $GITHUB_OUTPUT

          # Fail if tests failed
          exit ${TEST_RESULT:-0}
        env:
          ROSETTA_URL: http://localhost:8082
          CARDANO_NETWORK: preprod

      - name: Run golden example tests
        id: golden_tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          cd /home/integration/git/cardano-rosetta-java/tests/integration

          # Run golden example tests (construction + data endpoints)
          uv run test_golden_examples.py \
            -v || GOLDEN_RESULT=$?

          # Output test result
          echo "golden_result=${GOLDEN_RESULT:-0}" >> $GITHUB_OUTPUT

          # Fail if golden example tests failed
          exit ${GOLDEN_RESULT:-0}
        env:
          ROSETTA_URL: http://localhost:8082
          CARDANO_NETWORK: preprod

      # Stop our project even if checkout or deployment failed, before reporting.
      - name: Stop PR Preprod deployment and retain data
        if: always()
        run: |
          set -euo pipefail
          cd /home/integration/git/cardano-rosetta-java
          docker compose \
            --env-file .env.docker-compose-preprod \
            --env-file .env.docker-compose-profile-mid-level \
            -f docker-compose.yaml \
            down --remove-orphans

      - name: Verify Node.js for Allure 3
        if: always()
        run: |
          NODE_VER=$(node -p "process.versions.node.split('.')[0]" 2>/dev/null) || { echo "Node.js not found"; exit 1; }
          [ "$NODE_VER" -ge 18 ] || { echo "Node.js >= 18 required, found v$NODE_VER"; exit 1; }

      - name: Generate Allure report
        if: always()
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          cd /home/integration/git/cardano-rosetta-java/tests/data-endpoints

          # Generate Allure 3 HTML report
          rm -rf allure-report
          npx --yes allure@3.1.0 generate ./allure-results --output allure-report
          echo "Allure report generated successfully"

      - name: Deploy report to GitHub Pages
        if: |
          always() &&
          steps.test.outcome != 'skipped' &&
          github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /home/integration/git/cardano-rosetta-java/tests/data-endpoints/allure-report
          destination_dir: test-reports/pr-${{ github.event.pull_request.number }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Cleanup gh-pages temp directories
        if: always()
        run: rm -rf ~/actions_github_pages_*

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.issue.number;

            // Check if earlier steps failed (deployment, sync, etc.)
            const testsSkipped = '${{ steps.test.outcome }}' === 'skipped';

            let emoji, status;
            if (testsSkipped) {
              emoji = '💥';
              status = 'DEPLOYMENT FAILED';
            } else {
              // Check all three test outputs
              const smokeResult = '${{ steps.smoke_tests.outputs.smoke_result }}';
              const testResult = '${{ steps.test.outputs.test_result }}';
              const goldenResult = '${{ steps.golden_tests.outputs.golden_result }}';

              const allPassed = smokeResult === '0' && testResult === '0' && goldenResult === '0';
              emoji = allPassed ? '✅' : '❌';
              status = allPassed ? 'PASSED' : 'FAILED';
            }

            // Build comment body
            let comment = `## ${emoji} Preprod Tests: ${status}\n\n`;

            // Add report link (only if tests actually ran)
            if (!testsSkipped) {
              const reportUrl = `https://cardano-foundation.github.io/cardano-rosetta-java/test-reports/pr-${prNumber}/`;
              comment += `📊 **[View Detailed Test Report](${reportUrl})**\n\n`;
            }

            comment += `🔗 [Action Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n`;
            comment += `_Tests run against preprod network with live blockchain data_`;

            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });
