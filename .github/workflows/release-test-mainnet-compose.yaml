name: Pre-release testing - Mainnet Docker Compose

on:
  workflow_call:
    inputs:
      candidate_api_image:
        required: true
        type: string
      candidate_cardano_node_image:
        required: true
        type: string
      candidate_indexer_image:
        required: true
        type: string
      candidate_mithril_image:
        required: true
        type: string
      candidate_postgres_image:
        required: true
        type: string
      upgrade_api_image:
        required: true
        type: string
      upgrade_indexer_image:
        required: true
        type: string
      prerelease_tag:
        required: true
        type: string
      upgrade_from_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_SCRIPTS: ${{ github.workspace }}/.release-automation/.github/scripts
  PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
  COMPOSE_BASE_ENV: .env.docker-compose

  API_IMAGE: ${{ inputs.candidate_api_image }}
  CARDANO_NODE_IMAGE: ${{ inputs.candidate_cardano_node_image }}
  CARDANO_NODE_DIR: /opt/cardano-rosetta-java/mainnet/node_data
  COMPOSE_MIN_FREE_GIB: "1100"
  DATA_ROOT: /opt/cardano-rosetta-java/mainnet
  DB_PATH: /opt/cardano-rosetta-java/mainnet/sql_data
  DEPLOY_DIR: ${{ github.workspace }}/.release-target
  EXPECTED_HOST: zur2-s-d-115.colo2.cf-systems.internal
  INDEXER_IMAGE: ${{ inputs.candidate_indexer_image }}
  MITHRIL_IMAGE: ${{ inputs.candidate_mithril_image }}
  POSTGRES_IMAGE: ${{ inputs.candidate_postgres_image }}
  PROJECT_NAME: cardano-rosetta-java
  UPGRADE_API_IMAGE: ${{ inputs.upgrade_api_image }}
  UPGRADE_INDEXER_IMAGE: ${{ inputs.upgrade_indexer_image }}

  # Release policy. These values outrank every --env-file, so committed
  # defaults are read as-is and never rewritten.
  NETWORK: mainnet
  RELEASE_VERSION: ${{ inputs.prerelease_tag }}
  REMOVE_SPENT_UTXOS: "false"
  TOKEN_REGISTRY_BASE_URL: http://zur2-s-d-115.colo2.cf-systems.internal:8080/api
  TOKEN_REGISTRY_ENABLED: "true"
  TOKEN_REGISTRY_HOSTNAME: zur2-s-d-115.colo2.cf-systems.internal

jobs:
  preflight:
    runs-on: [rosetta-server-colo2]
    timeout-minutes: 180
    outputs:
      machine_specs: ${{ steps.machine.outputs.machine_specs }}
    steps:
      - &checkout_automation
        name: Check out immutable test automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-automation
          sparse-checkout: .github/scripts
          persist-credentials: false

      - &checkout_target
        name: Check out immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cardano-foundation/cardano-rosetta-java
          ref: ${{ inputs.source_sha }}
          path: .release-target
          persist-credentials: false

      - name: Validate Compose runner
        run: |
          set -euo pipefail

          for command in ab curl docker find findmnt git jq lscpu python3 realpath stat sudo tee; do
            command -v "$command"
          done
          docker compose version
          sudo -n true
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 10):
              raise SystemExit(f"Python 3.10+ is required, found {sys.version}")
          PY

          if [[ "$(realpath -e "$DATA_ROOT")" != "$DATA_ROOT" || -L "$DATA_ROOT" ]]; then
            echo "Mainnet data root is not a canonical directory: $DATA_ROOT"
            exit 1
          fi
          source "$RELEASE_SCRIPTS/release_test_runtime.sh"
          require_release_host

      - name: Validate Compose service and data ownership
        run: |
          set -euo pipefail
          source "$RELEASE_SCRIPTS/release_test_compose.sh"
          for service in db cardano-node; do
            mapfile -t containers < <(docker ps \
              --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
              --filter "label=com.docker.compose.service=${service}" \
              --format '{{.ID}}')
            if (( ${#containers[@]} != 1 )); then
              echo "Expected one running $service container for $PROJECT_NAME, found ${#containers[@]}."
              exit 1
            fi
          done
          verify_compose_mounts owned

      - name: Validate Compose database access
        run: |
          set -euo pipefail
          source "$RELEASE_SCRIPTS/release_test_compose.sh"
          verify_compose_database_access

      - name: Validate Compose upgrade source
        env:
          UPGRADE_FROM_TAG: ${{ inputs.upgrade_from_tag }}
        run: |
          set -euo pipefail
          source "$RELEASE_SCRIPTS/release_test_runtime.sh"
          source "$RELEASE_SCRIPTS/release_test_compose.sh"
          PHASE="Compose upgrade source" SYNC_TIMEOUT_SECONDS=0 \
            wait_for_release_live http://127.0.0.1:8082 mainnet "$UPGRADE_FROM_TAG"
          docker pull "$UPGRADE_API_IMAGE"
          docker pull "$UPGRADE_INDEXER_IMAGE"
          verify_compose_container api "$UPGRADE_API_IMAGE"
          verify_compose_container yaci-indexer "$UPGRADE_INDEXER_IMAGE"

      - name: Prepare pinned candidate images for Compose
        run: |
          set -euo pipefail
          source "$RELEASE_SCRIPTS/release_test_compose.sh"
          verify_and_prefetch_compose_target

      - name: Validate Compose data filesystem and projected cleanup space
        run: |
          set -euo pipefail
          db_path="$DB_PATH"
          node_path="$CARDANO_NODE_DIR"
          db_device=$(df --output=source "$db_path" | awk 'NR == 2 {print $1}')
          node_device=$(df --output=source "$node_path" | awk 'NR == 2 {print $1}')
          if [[ "$db_device" != "$node_device" ]]; then
            echo "Compose data paths must use the same filesystem."
            exit 1
          fi
          source "$RELEASE_SCRIPTS/release_test_runtime.sh"
          require_release_cleanup_space \
            "$DATA_ROOT" "$COMPOSE_MIN_FREE_GIB" "$db_path" "$node_path"

      - name: Discover published Compose baseline
        run: |
          set -euo pipefail
          source "$RELEASE_SCRIPTS/release_test_performance.sh"
          compare_release_performance docker-compose.md --check-baseline-only

      - name: Capture runner configuration
        id: machine
        run: |
          set -euo pipefail
          source "$RELEASE_SCRIPTS/release_test_runtime.sh"
          compose_version=$(docker compose version --short)
          capture_release_machine "$DB_PATH" "Mainnet Compose" "Docker Compose $compose_version"

  upgrade:
    needs: preflight
    runs-on: [rosetta-server-colo2]
    timeout-minutes: 1440
    outputs:
      mutation_started: ${{ steps.mutation.outputs.started }}
    steps:
      - *checkout_automation
      - *checkout_target
      - name: Prepare Docker Compose upgrade
        run: |
          set -euo pipefail
          source "$RELEASE_SCRIPTS/release_test_compose.sh"
          prepare_compose_images
          verify_compose_database_access

      # Failures after this point may require destructive recovery.
      - name: Mark Compose mutation boundary
        id: mutation
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Upgrade Docker Compose to pinned pre-release images
        run: |
          set -euo pipefail
          source "$RELEASE_SCRIPTS/release_test_compose.sh"
          release_compose up --detach --pull never --no-build

      - name: Wait for upgraded Compose deployment to reach LIVE
        env:
          PHASE: Upgraded Compose deployment
          SYNC_TIMEOUT_SECONDS: "72000"
        run: &wait_for_compose |
          set -euo pipefail
          source "$RELEASE_SCRIPTS/release_test_compose.sh"
          wait_for_compose_target_live

  clean-resync:
    # Recover only after a successful upgrade or a failure beyond the mutation boundary.
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && (needs.upgrade.result == 'success' || (needs.upgrade.result == 'failure' && needs.upgrade.outputs.mutation_started == 'true')) }}
    needs:
      - preflight
      - upgrade
    uses: ./.github/workflows/release-test-mainnet-clean-resync.yaml
    with:
      deployment: docker-compose
      target_api_image: ${{ inputs.candidate_api_image }}
      target_cardano_node_image: ${{ inputs.candidate_cardano_node_image }}
      target_image_tag: ${{ inputs.prerelease_tag }}
      target_indexer_image: ${{ inputs.candidate_indexer_image }}
      target_mithril_image: ${{ inputs.candidate_mithril_image }}
      target_postgres_image: ${{ inputs.candidate_postgres_image }}
      target_source_sha: ${{ inputs.source_sha }}

  performance:
    needs:
      - preflight
      - clean-resync
    runs-on: [rosetta-server-colo2]
    timeout-minutes: 720
    steps:
      - *checkout_automation
      - *checkout_target
      - name: Prepare immutable Compose release harness
        run: |
          set -euo pipefail
          source "$RELEASE_SCRIPTS/release_test_compose.sh"
          write_compose_override

      - name: Revalidate Compose candidate before performance testing
        env:
          PHASE: Compose performance preflight
          SYNC_TIMEOUT_SECONDS: "0"
        run: *wait_for_compose

      - name: Run legacy stability test against Docker Compose
        id: stability
        env:
          MACHINE_SPECS: ${{ needs.preflight.outputs.machine_specs }}
        run: |
          set -euo pipefail
          source "$RELEASE_SCRIPTS/release_test_performance.sh"
          run_release_stability http://127.0.0.1:8082

      - name: Compare with the latest published Compose result
        env:
          RESULT_DIR: ${{ steps.stability.outputs.result_dir }}
        run: |
          set -euo pipefail
          source "$RELEASE_SCRIPTS/release_test_performance.sh"
          compare_release_performance docker-compose.md \
            --candidate-dir "$RESULT_DIR" --deployment "Mainnet Docker Compose"
          cat "$RESULT_DIR/performance-comparison.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Compose performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainnet-compose-performance-${{ inputs.prerelease_tag }}
          path: ${{ steps.stability.outputs.result_dir }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30
